<!doctype html><html lang="en-AU" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forms & Applications — JIGAR.AU</title><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css"><style>
.public-form-page{width:min(920px,calc(100% - 40px));margin:0 auto;padding:76px 0 110px;min-height:65vh}
.public-form-intro{margin-bottom:42px}.public-form-intro h1{font-size:clamp(38px,6vw,64px);letter-spacing:-.06em;line-height:1.05;margin:12px 0}.public-form-intro>p:not(.kicker){color:var(--muted);line-height:1.65;max-width:720px}
.public-form-section{margin:48px 0}.public-form-section-heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:20px}.public-form-section-heading h2{font-size:clamp(26px,4vw,36px);letter-spacing:-.045em;margin:4px 0}.public-form-section-heading p:not(.kicker){color:var(--muted);margin:7px 0 0}.public-form-count{display:grid;place-items:center;min-width:38px;height:38px;border:1px solid var(--line);border-radius:50%;color:var(--muted);font-size:13px}
.public-form-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.public-form-list-card,.public-form-card{padding:26px;border:1px solid var(--line);border-radius:20px;background:var(--panel);box-shadow:0 10px 35px #00000008}.public-form-list-card h2{font-size:22px;letter-spacing:-.035em;margin:16px 0 8px}.public-form-list-card p{color:var(--muted);line-height:1.6}.public-form-status{display:inline-flex;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:650;background:#e8f6ed;color:#176b38}.public-form-status.archived{background:#eef1f6;color:#566274}.public-form-open-link{display:inline-flex;align-items:center;gap:10px;text-decoration:none;margin-top:12px}.public-form-empty{grid-column:1/-1;padding:22px;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}
.public-form-archived-notice{padding:12px 15px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--muted)}.public-field{display:grid;gap:8px;margin:20px 0;font-weight:550}.public-field input,.public-field textarea,.public-field select{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:11px;background:var(--page);color:var(--text);font:inherit}.public-field textarea{min-height:120px;resize:vertical}.public-check{display:flex;align-items:flex-start;gap:10px;margin:20px 0}.public-check input{margin-top:5px}.form-privacy{font-size:12px;color:var(--muted);line-height:1.6}.form-honeypot{position:absolute;left:-10000px}.public-form-card .account-submit{cursor:pointer}.public-form-card .account-submit:disabled{opacity:.6;cursor:wait}
@media(max-width:650px){.public-form-page{width:min(100% - 28px,920px);padding:52px 0 80px}.public-form-list{grid-template-columns:1fr}.public-form-list-card,.public-form-card{padding:21px}.public-form-section-heading{align-items:flex-start}}
</style><script defer src="/script.js"></script><script type="module" src="/assets/js/forms.js"></script></head><body><header class="global-nav"><a class="brand" href="/">J.</a><nav class="nav-links" style="display:flex"><a href="/">Portfolio</a><a href="/forms/" aria-current="page">Forms</a><a href="/account/">Account</a></nav></header><main class="public-form-page"><div id="public-form"><p>Loading form…</p></div></main><footer class="footer"><div class="footer-top"><a class="footer-brand" href="/">J. <span>Jigar Rai</span></a><span class="footer-motto">Think Beyond. Build Beyond.</span><a href="/forms/">All forms</a><a href="/">Back to portfolio</a></div></footer></body></html>
